<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tempo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="update-bar" id="updateBar" role="status" hidden>
  <span>Nueva versión <span id="updateVer"></span> disponible</span>
  <span id="updateErr" hidden></span>
  <button class="btn link" id="updateInstall">Actualizar</button>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="timer" id="tab-timer">Temporizador</button>
  <button class="tab" role="tab" data-tab="metro" id="tab-metro">Metrónomo</button>
  <button class="tab" role="tab" data-tab="todo" id="tab-todo">Tareas</button>
</nav>

<!-- ───────── Temporizador ───────── -->
<section class="panel timer" id="panel-timer" role="tabpanel" aria-labelledby="tab-timer">
  <div class="ring" id="ring">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle class="ring-track" cx="120" cy="120" r="110"></circle>
      <circle class="ring-fill" id="ringFill" cx="120" cy="120" r="110"></circle>
    </svg>
    <div class="ring-center">
      <label class="time time-edit" id="timeEdit" title="Haz clic para cambiar la duración">
        <input type="text" inputmode="numeric" id="customMin" maxlength="4" value="25" aria-label="Minutos">
        <span>:</span>
        <input type="text" inputmode="numeric" id="customSec" maxlength="2" value="00" aria-label="Segundos">
      </label>
      <div class="time" id="timerDisplay" hidden>25:00</div>
      <div class="status" id="timerStatus" role="status">Listo</div>
    </div>
  </div>

  <div class="group">
    <div class="eyebrow">Duración</div>
    <div class="duration-row">
      <div class="seg" id="presets">
        <button data-min="5">5</button>
        <button data-min="15">15</button>
        <button data-min="25">25</button>
        <button data-min="45">45</button>
      </div>
      <span class="unit">min</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="timerMain">Iniciar</button>
    <button class="btn link" id="timerReset">Reiniciar</button>
  </div>

  <p class="hint"><kbd>Espacio</kbd> iniciar / pausar</p>
</section>

<!-- ───────── Metrónomo ───────── -->
<section class="panel metro" id="panel-metro" role="tabpanel" aria-labelledby="tab-metro" hidden>
  <!-- Escala de metrónomo analógico: lento arriba, rápido abajo; la pesa marca el tempo -->
  <div class="scale" id="scale" role="slider" tabindex="0" aria-label="Tempo"
       aria-valuemin="30" aria-valuemax="240" aria-valuenow="100">
    <div class="rail" id="rail">
      <div class="weight" id="weight"></div>
    </div>
  </div>

  <div class="metro-side">
    <div class="hero">
      <div class="bpm"><span id="bpmDisplay">100</span><small>BPM</small></div>
      <div class="tempo-name" id="tempoName">Andante</div>
      <div class="bpm-note" id="bpmNote"></div>
    </div>

    <!-- compás (fracción con ‹ ›) y pulsos: clic en un pulso lo acentúa -->
    <div class="beat-row">
      <div class="meter" id="meter" role="spinbutton" tabindex="0" aria-label="Compás" title="Compás">
        <button class="meter-arrow" id="meterPrev" tabindex="-1" aria-label="Compás anterior">‹</button>
        <span class="frac"><span id="meterNum">4</span><span id="meterDen">4</span></span>
        <button class="meter-arrow" id="meterNext" tabindex="-1" aria-label="Compás siguiente">›</button>
      </div>
      <div class="dots" id="dots" title="Clic en un pulso para acentuarlo"></div>
    </div>

    <div class="volume" id="volume">
      <button class="vol-icon" id="volMute" aria-label="Silenciar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="spk" d="M4 9h4l5-4v14l-5-4H4z"></path>
          <path class="wave w1" d="M16 9.5a3.5 3.5 0 0 1 0 5"></path>
          <path class="wave w2" d="M18.5 7a7 7 0 0 1 0 10"></path>
          <path class="mute" d="M16.5 9.5l5 5m0-5l-5 5"></path>
        </svg>
      </button>
      <input type="range" class="slider" id="volRange" min="0" max="100" value="80" aria-label="Volumen">
    </div>

    <button class="btn primary block" id="metroToggle">Iniciar</button>

    <p class="notice" id="metroNotice" hidden>Se detuvo al ocultar la ventana.</p>
    <p class="hint"><kbd>Espacio</kbd> iniciar / parar · <kbd>↑</kbd><kbd>↓</kbd> ±1</p>
  </div>
</section>

<!-- ───────── Tareas ───────── -->
<section class="panel todo" id="panel-todo" role="tabpanel" aria-labelledby="tab-todo" hidden>
  <form class="todo-form" id="todoForm" autocomplete="off">
    <input type="text" class="field" id="todoInput" placeholder="Nueva tarea…" maxlength="200" aria-label="Nueva tarea">
    <button class="btn primary" type="submit">Añadir</button>
  </form>

  <ul class="todo-list" id="todoList" aria-label="Tareas"></ul>
  <p class="todo-empty" id="todoEmpty">No hay tareas</p>

  <div class="todo-foot">
    <span id="todoCount"></span>
    <button class="btn link" id="todoClear">Borrar completadas</button>
  </div>

  <p class="hint"><kbd>Intro</kbd> añadir · doble clic para editar · arrastra <span class="grip-glyph">⋮⋮</span> para ordenar</p>
</section>

<script src="metronome.js"></script>
<script src="app.js"></script>
</body>
</html>
