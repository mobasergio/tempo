<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tempo — Ahora</title>
<script>
  (function () {
    var d = document.documentElement;
    try { d.dataset.theme = localStorage.getItem('tempo.theme') || 'dark'; } catch (e) { d.dataset.theme = 'dark'; }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="widget-page">
<div class="widget" id="widget" data-tiny-drag>
  <div class="w-top">
    <button class="w-title" id="wTitle" data-tiny-nodrag data-i18n-title="widget.openSched" title="Abrir el horario">Sin actividad</button>
    <button class="w-close" id="wClose" data-tiny-nodrag data-i18n-aria="widget.hide" data-i18n-title="widget.hide"
            aria-label="Ocultar widget" title="Ocultar widget">×</button>
  </div>
  <div class="w-mid">
    <span class="w-count" id="wCount"></span>
    <span class="w-until" id="wUntil"></span>
  </div>
  <div class="w-bar"><div class="w-fill" id="wFill"></div></div>
  <div class="w-next" id="wNext"></div>
</div>
<script type="module" src="widget.js"></script>
</body>
</html>
